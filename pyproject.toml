[project]
name = "fastapi-blog-api"
version = "1.0.0"
description = "A production-ready FastAPI blog API with comprehensive testing"
requires-python = ">=3.11"
dependencies = [
    # FastAPI and Web
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.17",
    "python-slugify==8.0.4",
    
    # Database
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "aiosqlite==0.20.0",
    "asyncpg==0.30.0",
    
    # Authentication
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    
    # Validation
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "factory-boy==3.3.1",
    "faker==30.8.2",
    "hypothesis==6.122.0",
    
    # Development
    "black==24.10.0",
    "ruff==0.7.3",
    "mypy==1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --cov=app --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (database, external services)",
    "e2e: End-to-end tests (full application flow)",
    "property_based: Property-based tests with Hypothesis",
    "slow: Slow tests that should run separately",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.2",
    "factory-boy>=3.3.1",
    "faker>=30.8.2",
    "hypothesis>=6.122.0",
    "respx>=0.21.1",
    "black>=24.10.0",
    "ruff>=0.7.3",
    "mypy>=1.13.0",
]
